name: race

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-race:
    name: Go race detector
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: "1"
      GOFLAGS: -tags=stdjson,gjson
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
      - run: go mod download
      - name: Run race detector across Go packages
        run: go test -race ./...
